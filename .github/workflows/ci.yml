name: CI

# 這個 repo 在 2026-09 之前完全沒有 CI，結果 tests.test_route_inventory
# 紅了兩個 ORDER 都沒人發現。這條 workflow 的存在就是為了讓 main
# 「可發布」這件事有憑據，而不是靠記得在本機跑。
# 只在 PR 上跑。push 到 main 的測試由 deploy.yml 的第一個 job 負責
# （部署前本來就要先綠），同一份測試不必跑兩次。
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 是 Dockerfile 實際出貨的版本（python:3.10-slim），
        # 3.11 是目前開發驗證過的版本。兩個都跑，才不會出現
        # 「CI 綠但線上壞」或反過來。
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run CI test scope
        # 範圍與排除理由寫在 scripts/check_ci.sh 裡。
        # 排除的是需要 Windows 或選用依賴的模組，不是「會紅所以關掉」。
        run: ./scripts/check_ci.sh

  audit:
    # 相依套件的已知 CVE 掃描（供應鏈防護 follow-up）。
    # 刻意「advisory」：新披露的上游 CVE 只顯示、不擋 PR，才不會讓
    # 不相關的變更被卡住。要改成強制時，把 continue-on-error 拿掉並
    # 維護一份 --ignore-vuln 清單即可。deploy.yml 不掛這個 job，
    # 上線流程不會因為一個新 CVE 而被擋。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: pip-audit (advisory)
        continue-on-error: true
        run: pip-audit
